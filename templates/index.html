<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitPulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #21262d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-dim: #1f3a5f;
      --green: #3fb950;
      --red: #f85149;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .logo {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-align: center;
      margin-bottom: 1rem;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      text-align: center;
      margin-bottom: 2.5rem;
      max-width: 36ch;
      line-height: 1.6;
    }

    .search-form {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder {
      color: var(--muted);
    }

    button[type="submit"] {
      background: var(--accent);
      color: #0d1117;
      border: none;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    button[type="submit"]:hover { opacity: 0.85; }

    .error {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      color: var(--red);
      font-size: 0.85rem;
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
    }

    .examples {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    .examples a {
      color: var(--accent);
      text-decoration: none;
      margin: 0 0.25rem;
    }

    .examples a:hover { text-decoration: underline; }

    .api-note {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--muted);
      font-family: var(--mono);
      text-align: center;
    }

    .api-note code {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-dot"></span>
    GitPulse
  </div>

  <h1>GitHub activity,<br><span>at a glance</span></h1>
  <p class="subtitle">Enter any public GitHub username to see commits, top repos, and activity patterns.</p>

  <form class="search-form" method="POST" action="/">
    <div class="input-row">
      <input
        type="text"
        name="username"
        placeholder="github username"
        value="{{ query or '' }}"
        autofocus
        autocomplete="off"
        spellcheck="false"
      />
      <button type="submit">Analyze →</button>
    </div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
  </form>

  

  <p class="api-note">JSON API available at <code>/api/user/&lt;username&gt;</code></p>
</body>
</html>
